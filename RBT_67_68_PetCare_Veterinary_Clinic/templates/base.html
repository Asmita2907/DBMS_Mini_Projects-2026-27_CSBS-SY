<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PetCare – {{ title }}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head><body>
<aside class="side" id="side">
  <div class="brand">🐾 <span>PetCare</span></div>
  <nav>{% for href, ico, label in nav %}
    <a href="{{ href }}" class="{{ 'on' if request.path == href else '' }}"><i>{{ ico }}</i>{{ label }}</a>{% endfor %}
  </nav>
  <div class="foot">Veterinary Clinic Management</div>
</aside>
<main>
  <button class="menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for c, m in msgs %}
    <div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block js %}{% endblock %}
</body></html>
